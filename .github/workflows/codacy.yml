name: Codacy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy:
    # One Codacy CLI run per tool. Only the tools that analyse this repository successfully are
    # listed (Agentlinter, Biome, ESLint 9, Jacksonlinter, JSHint, Markdownlint, Oxlint, PMD, PMD 7
    # and remark-lint failed and were removed at the repository owner's request). Each tool uploads
    # under its own category, which also keeps every upload under code scanning's 20-run limit.
    name: Codacy analysis (${{ matrix.tool }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tool:
          - bandit
          - checkov
          - lizard
          - opengrep
          - prospector
          - pylint
          - pylintpython3
          - ruff
          - spectral
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          tool: ${{ matrix.tool }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Give each SARIF run its own category
        if: hashFiles('results.sarif') != ''
        run: |
          jq '.runs |= (to_entries | map(.value + {automationDetails: {id: ("codacy/" + (.value.tool.driver.name // "codacy") + "/" + (.key | tostring))}}))' results.sarif > results.fixed.sarif
          mv results.fixed.sarif results.sarif

      - name: Upload SARIF to code scanning
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: codacy-${{ matrix.tool }}
